name: Govini
description: >-
  Govini (rebranded to Air, air.ai, in 2026) is a defense-technology and
  decision-analytics company whose Ark platform combines proprietary defense
  acquisition data with AI-enabled applications to close the national-security
  "Readiness Gap" across supply chain, science and technology, production,
  sustainment, logistics, and modernization missions. Ark holds FedRAMP High
  authorization and a DISA Impact Level 5 (IL5) Provisional Authorization plus
  service-level IL5 ATOs, making it a closed, government-authorized SaaS platform
  rather than a public developer API. Led by CEO Tara Murphy Dougherty and backed
  by investors including Accel and Bain Capital. This profile entered the API
  Evangelist network as a portfolio-lead stub and has been enriched with the
  provider's real public identity, security posture, and published compliance
  authorizations.
